{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-body text-center">

            <h3>Delete Payroll Record</h3>

            <p class="mt-3">
                Are you sure you want to delete the payroll record for
                <strong>{{ payroll.employee.name }}</strong>
                for
                <strong>{{ payroll.month|date:"F Y" }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'payroll_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>

        </div>
    </div>

</div>

{% endblock %}
