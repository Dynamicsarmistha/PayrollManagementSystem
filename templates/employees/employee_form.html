{% extends 'base.html' %} {% block content %}

<style>
  .employee-form-container {
    max-width: 650px;
    margin: 35px auto;
    padding: 0 20px;
  }

  .employee-form-card {
    background: #ffffff;
    border: 1px solid #e9ecef;
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
  }

  .employee-form-title {
    font-size: 28px;
    font-weight: 700;
    color: #263238;
    margin-bottom: 28px;
  }

  .employee-form p {
    margin-bottom: 20px;
  }

  .employee-form label {
    display: block;
    font-weight: 600;
    color: #37474f;
    margin-bottom: 7px;
  }

  .employee-form input,
  .employee-form select,
  .employee-form textarea {
    width: 100%;
    min-height: 42px;
    padding: 8px 12px;
    border: 1px solid #ced4da;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
    background: #ffffff;
  }

  .employee-form input:focus,
  .employee-form select:focus,
  .employee-form textarea:focus {
    border-color: #607d8b;
    box-shadow: 0 0 0 3px rgba(96, 125, 139, 0.12);
    outline: none;
  }

  .employee-form ul.errorlist {
    color: #dc3545;
    font-size: 14px;
    margin: 5px 0 0;
    padding-left: 20px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
  }

  .save-btn {
    background: #37474f;
    border: 1px solid #37474f;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }

  .save-btn:hover {
    background: #263238;
    border-color: #263238;
  }

  .cancel-btn {
    background: #eceff1;
    border: 1px solid #cfd8dc;
    color: #37474f;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
  }

  .cancel-btn:hover {
    background: #cfd8dc;
    color: #263238;
  }

  @media (max-width: 768px) {
    .employee-form-container {
      margin: 20px auto;
      padding: 0 12px;
    }

    .employee-form-card {
      padding: 22px;
    }

    .employee-form-title {
      font-size: 24px;
    }

    .form-actions {
      flex-direction: column;
    }

    .save-btn,
    .cancel-btn {
      width: 100%;
    }
  }
</style>

<div class="employee-form-container">
  <div class="employee-form-card">
    <h2 class="employee-form-title">{{ title }}</h2>

    <form method="post" class="employee-form">
      {% csrf_token %} {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="save-btn">Save Employee</button>

        <a href="{% url 'employee_list' %}" class="cancel-btn"> Cancel </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
